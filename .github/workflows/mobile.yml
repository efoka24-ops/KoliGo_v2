name: Build Android APK

on:
  push:
    branches: [001-koligo-monorepo]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate Android project (expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Bundle JavaScript
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://koligoapi.trugroup.cm
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build release APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://koligoapi.trugroup.cm
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -x bundleReleaseJsAndAssets \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon

      - name: Locate and rename APK
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK trouvé : $APK"
          mv "$APK" mobile/android/app/build/outputs/apk/release/koligo-${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "KoliGo Android — Build #${{ github.run_number }}"
          body: |
            **Build automatique**
            - Commit : `${{ github.sha }}`
            - Branche : `${{ github.ref_name }}`
            - Par : ${{ github.actor }}
            - API : `https://koligoapi.trugroup.cm`
          files: mobile/android/app/build/outputs/apk/release/koligo-${{ github.run_number }}.apk
          prerelease: true
