name: Deploy backend

# The server tracks preprod, so a merge there is what ships. workflow_dispatch
# stays available to redeploy the same commit without pushing anything.
on:
  push:
    branches: [preprod]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  # Never let two deploys touch the server at once; the newer one wins.
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Open an SSH session to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinning the host key is what stops a man-in-the-middle from
          # collecting the deploy key; never replace this with StrictHostKeyChecking=no.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Pull, migrate, build, restart
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; cd '$DEPLOY_PATH/backend' && bash deploy.sh preprod"

      - name: Check the API answers
        env:
          HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          url="${HEALTH_URL:-https://koligoapi.trugroup.cm/health}"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            [ "$code" = "200" ] && { echo "health OK"; exit 0; }
            echo "attempt $i: $code"; sleep 6
          done
          echo "the API never returned 200 — deployment is not healthy"
          exit 1

      - name: Check the payment webhook route is mounted
        env:
          BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
        run: |
          base="${BASE_URL:-https://koligoapi.trugroup.cm}"
          # 401 means the route exists and rejected an unsigned body, which is
          # the correct answer here. 404 means the new code is not live.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "$base/payment/webhook/apisungku" \
            -H 'Content-Type: application/json' -d '{}' || true)
          echo "webhook route -> $code"
          [ "$code" = "404" ] && { echo "route missing: the deploy did not take"; exit 1; }
          exit 0
